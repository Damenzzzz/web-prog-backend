<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профиль — Zhibek Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Prata&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="profile">
  <header class="header">
    <a class="logo" href="index.html">Zhibek <span>lite</span></a>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
      <a class="active" href="profile.html">Профиль</a>
      <a href="fitting-room.html">Примерочная <span id="room-count" class="count" hidden></span></a>
    </nav>
  </header>

  <main>
    <section class="section two-columns">
      <div>
        <h1>Анкета</h1>
        <p class="muted">Рост, вес и тип фигуры учитываются при AI-примерке.</p>
        <form id="profile-form" class="form">
          <label>Имя
            <input name="name" required maxlength="50" autocomplete="given-name">
          </label>
          <div class="form-row">
            <label>Рост, см
              <input name="height_cm" type="number" required>
            </label>
            <label>Вес, кг
              <input name="weight_kg" type="number" required>
            </label>
          </div>
          <div class="form-row">
            <label>Пол
              <select name="gender">
                <option value="female">Женский</option>
                <option value="male">Мужской</option>
              </select>
            </label>
            <label>Тип фигуры
              <select name="body_type">
                <option value="slim">Стройная</option>
                <option value="average" selected>Средняя</option>
                <option value="athletic">Спортивная</option>
                <option value="plus">Плюс-сайз</option>
              </select>
            </label>
          </div>
          <label><span>Любимый стиль (необязательно)</span>
            <input name="style_preference" maxlength="200" placeholder="минимализм, спокойные цвета">
          </label>
          <div class="actions">
            <button class="btn" type="submit">Сохранить</button>
            <button id="profile-delete" class="link danger" type="button" hidden>Удалить анкету</button>
          </div>
          <p id="profile-message" class="message"></p>
        </form>
      </div>

      <div class="panel">
        <h2>Фото для примерки</h2>
        <p class="muted">Загрузите фото в полный рост — на нём AI «наденет» вещи из примерочной. JPEG или PNG, до 5 МБ.</p>
        <img id="photo-preview" class="photo-preview" alt="Ваше фото" hidden>
        <form id="photo-form" class="form">
          <label>Файл
            <input name="file" type="file" accept="image/jpeg,image/png" required>
          </label>
          <div class="actions">
            <button class="btn" type="submit">Загрузить фото</button>
          </div>
          <p id="photo-message" class="message"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">Zhibek Lite — учебный проект по веб-программированию</footer>
  <script src="app.js"></script>
</body>
</html>
