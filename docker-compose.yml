name: zhibek-lite

services:
  db:
    image: postgres:16-alpine
    container_name: zhibek-lite-db
    environment:
      POSTGRES_USER: zhibek
      POSTGRES_PASSWORD: zhibek
      POSTGRES_DB: zhibek
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhibek -d zhibek"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: zhibek-lite:latest
    container_name: zhibek-lite
    # Значения берутся из .env рядом с этим файлом, если он есть; иначе — значения после ":-".
    # Без .env проект поднимается сразу: примерка в режиме mock, админ admin@zhibek.kz / adminpass123.
    environment:
      DATABASE_URL: postgresql+psycopg://zhibek:zhibek@db:5432/zhibek
      LLM_MOCK: ${LLM_MOCK:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BACKEND: ${GEMINI_BACKEND:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash-image}
      SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-change-me-0000000000}
      TOKEN_MINUTES: ${TOKEN_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@zhibek.kz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminpass123}
    ports:
      - "8090:8000"
    volumes:
      - uploads:/app/static/uploads
      - results:/app/static/results
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  results:
